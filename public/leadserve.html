<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LEADSERVE OMS</title>
    <link rel="icon" href="assets/leadserve-logo.png">
    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="assets/leadserve-firestore.js"></script>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-soft: #f9fafb;
            --ink: #172033;
            --ink-2: #3d4658;
            --muted: #6a7280;
            --line: #dde2ea;
            --blue: #075fb8;
            --blue-2: #0b7bdc;
            --teal: #0f766e;
            --gold: #a16207;
            --red: #b42318;
            --shadow: 0 18px 48px rgba(21, 32, 51, .10);
            --radius: 8px;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,.92), rgba(246,247,249,.95)),
                radial-gradient(circle at 20% 0%, rgba(11,123,220,.10), transparent 34%),
                radial-gradient(circle at 86% 8%, rgba(15,118,110,.08), transparent 30%),
                var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255,255,255,.92);
            border-bottom: 1px solid rgba(221,226,234,.92);
            backdrop-filter: blur(14px);
        }
        .topbar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .brand {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 12px;
        }
        .brand img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 4px;
        }
        .brand-title {
            font-weight: 850;
            font-size: 18px;
            letter-spacing: .02em;
        }
        .brand-sub {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .shell {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 20px 44px;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .panel-body { padding: 20px; }
        .panel-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .panel-title {
            font-size: 16px;
            font-weight: 800;
        }
        .panel-note {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            margin-top: 4px;
        }
        .logo-lockup {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px;
            min-height: 210px;
        }
        .logo-lockup img {
            width: min(100%, 360px);
            height: auto;
            display: block;
        }
        .metric-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .metric {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-soft);
            padding: 12px;
            min-height: 74px;
        }
        .metric-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .metric-value {
            margin-top: 6px;
            font-size: 20px;
            font-weight: 850;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0;
        }
        label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 15px 0 6px;
        }
        input {
            width: 100%;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 15px;
            color: var(--ink);
        }
        input:focus {
            border-color: rgba(7,95,184,.65);
            outline: 3px solid rgba(7,95,184,.14);
        }
        .btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }
        .btn.primary {
            border-color: transparent;
            background: var(--blue);
            color: #fff;
        }
        .btn.primary:hover { background: #064f98; }
        .btn.full { width: 100%; }
        .btn-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
        }
        .status {
            min-height: 18px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--muted);
        }
        .status.error { color: var(--red); }
        .clinic-view {
            display: grid;
            gap: 16px;
        }
        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
        }
        .user-chip {
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 999px;
            padding: 8px 12px;
            color: var(--ink-2);
            font-size: 13px;
            font-weight: 700;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .clinic-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .clinic-card {
            width: 100%;
            min-height: 164px;
            text-align: left;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            display: grid;
            gap: 10px;
            align-content: start;
        }
        .clinic-card:hover,
        .clinic-card:focus {
            outline: none;
            border-color: rgba(7,95,184,.72);
            box-shadow: 0 14px 34px rgba(7,95,184,.12);
            transform: translateY(-1px);
        }
        .clinic-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .clinic-name {
            font-size: 18px;
            font-weight: 850;
        }
        .clinic-meta {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }
        .clinic-badge {
            border-radius: 999px;
            background: rgba(7,95,184,.09);
            color: var(--blue);
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 850;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .clinic-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-top: 1px solid var(--line);
            padding-top: 10px;
            margin-top: 2px;
        }
        .open-label {
            color: var(--blue);
            font-size: 13px;
            font-weight: 850;
        }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
            .metric-strip { grid-template-columns: 1fr; }
        }
        @media (max-width: 680px) {
            .topbar-inner { align-items: flex-start; }
            .brand img { width: 46px; height: 46px; }
            .section-head { align-items: flex-start; flex-direction: column; }
            .clinic-grid { grid-template-columns: 1fr; }
            .top-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <style>
        .ls-wrap{--navy:#0a3d62;--blue:#1e73b8;--ink:#0f172a;--muted:#64748b;--line:#e6ebf2;--bg:#f4f7fb;}
        body{background:#f4f7fb;margin:0;font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;color:#0f172a;}
        .ls-topbar{background:#fff;border-bottom:1px solid #e6ebf2;}
        .ls-topbar-inner{max-width:1080px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;}
        .ls-brand{display:flex;align-items:center;gap:12px;}
        .ls-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0a3d62,#1e73b8);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 4px 12px rgba(10,61,98,.25);}
        .ls-name{font-weight:800;font-size:18px;letter-spacing:-.3px;line-height:1;}
        .ls-name b{color:#1e73b8;}
        .ls-tag{font-size:12px;color:#64748b;margin-top:3px;}
        .ls-signout{border:1px solid #e6ebf2;background:#fff;border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer;color:#0f172a;}
        .ls-signout:hover{background:#f4f7fb;}
        .ls-shell{max-width:1080px;margin:0 auto;padding:30px 20px 60px;}
        .ls-login{max-width:410px;margin:5vh auto 0;background:#fff;border:1px solid #e6ebf2;border-radius:18px;overflow:hidden;box-shadow:0 14px 44px rgba(15,23,42,.09);}
        .ls-login-hero{background:linear-gradient(135deg,#0a3d62,#1e73b8);color:#fff;padding:26px;text-align:center;}
        .ls-login-hero .ls-mark{margin:0 auto 12px;width:54px;height:54px;font-size:28px;border-radius:15px;background:rgba(255,255,255,.16);box-shadow:none;}
        .ls-login-hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;}
        .ls-login-hero p{margin:6px 0 0;font-size:13px;opacity:.85;}
        .ls-login-body{padding:22px 26px 28px;}
        .ls-login-body label{display:block;font-size:12px;font-weight:600;color:#64748b;margin:14px 0 5px;}
        .ls-login-body input{width:100%;padding:11px 13px;border:1px solid #e6ebf2;border-radius:10px;font:inherit;box-sizing:border-box;}
        .ls-login-body input:focus{outline:none;border-color:#1e73b8;box-shadow:0 0 0 3px rgba(30,115,184,.12);}
        .ls-cta{width:100%;margin-top:20px;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#0a3d62,#1e73b8);color:#fff;font:inherit;font-weight:700;cursor:pointer;}
        .ls-cta:hover{filter:brightness(1.07);}
        .ls-status{margin-top:12px;font-size:13px;color:#64748b;text-align:center;}
        .ls-status.error{color:#dc2626;}
        .ls-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
        .ls-head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px;}
        .ls-head p{margin:4px 0 0;font-size:14px;color:#64748b;}
        .ls-chip{background:#fff;border:1px solid #e6ebf2;border-radius:999px;padding:7px 14px;font-size:13px;}
        .ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
        .ls-card{position:relative;background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:20px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;overflow:hidden;text-align:left;font:inherit;color:inherit;display:block;width:100%;}
        .ls-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#1e73b8);}
        .ls-card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(15,23,42,.13);border-color:transparent;}
        .ls-card-top{display:flex;align-items:center;gap:13px;margin-bottom:16px;}
        .ls-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:var(--accent-bg,#e6f1fb);}
        .ls-cname{font-weight:700;font-size:17px;line-height:1.2;}
        .ls-cvert{font-size:12.5px;color:#64748b;margin-top:2px;}
        .ls-badge{position:absolute;top:18px;right:18px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--accent-bg,#e6f1fb);color:var(--accent,#1e73b8);}
        .ls-card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e6ebf2;padding-top:13px;}
        .ls-wid{font-size:12px;color:#94a3b8;}
        .ls-open{font-size:13px;font-weight:700;color:#1e73b8;}
        @media(max-width:560px){.ls-grid{grid-template-columns:1fr;}}
    </style>
    <header class="ls-topbar">
        <div class="ls-topbar-inner">
            <div class="ls-brand">
                <img src="assets/leadserve-logo.png" alt="LEADSERVE CMS" style="height:54px;width:auto;display:block;">
            </div>
            <button class="ls-signout hidden" id="btnSignOut" type="button">Sign out</button>
        </div>
    </header>

    <main class="ls-shell">
        <section id="loginView">
            <div class="ls-login">
                <div class="ls-login-hero">
                    <div style="background:#fff;border-radius:14px;padding:10px 18px;display:inline-block;margin-bottom:14px;">
                        <img src="assets/leadserve-logo.png" alt="LEADSERVE Clinics" style="height:46px;width:auto;display:block;">
                    </div>
                    <h1>Welcome back</h1>
                    <p>Sign in to open your clinic workspace</p>
                </div>
                <div class="ls-login-body">
                    <label for="email">Email</label>
                    <input id="email" type="email" autocomplete="username" placeholder="you@clinic.ph">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
                    <button class="ls-cta" id="btnLogin" type="button">Continue</button>
                    <div class="ls-status" id="loginStatus"></div>
                </div>
            </div>
        </section>

        <section id="clinicView" class="hidden">
            <div class="ls-head">
                <div>
                    <h1>Your clinic workspaces</h1>
                    <p id="userLine">Choose a clinic to open.</p>
                </div>
                <div class="ls-chip" id="userChip"></div>
            </div>
            <div class="ls-grid" id="clinicGrid"></div>
            <div class="ls-status" id="clinicStatus"></div>
        </section>
    </main>

    <script>
        if (!firebase.apps.length) {
            firebase.initializeApp(window.OMS_CONFIG.firebase);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        const tenants = window.OMS_TENANTS || {};
        const tenantIds = Object.keys(tenants);

        const el = (id) => document.getElementById(id);
        const loginView = el("loginView");
        const clinicView = el("clinicView");
        const clinicGrid = el("clinicGrid");
        const loginStatus = el("loginStatus");
        const clinicStatus = el("clinicStatus");
        const btnSignOut = el("btnSignOut");

        function setStatus(node, message, isError) {
            node.textContent = message || "";
            node.classList.toggle("error", Boolean(isError));
        }

        function showLogin() {
            loginView.classList.remove("hidden");
            clinicView.classList.add("hidden");
            btnSignOut.classList.add("hidden");
            el("userChip").textContent = "";
        }

        function showClinics(user) {
            loginView.classList.add("hidden");
            clinicView.classList.remove("hidden");
            btnSignOut.classList.remove("hidden");
            el("userLine").textContent = "Open the clinic workspace for this session.";
            el("userChip").textContent = user.email || "Signed-in user";
        }

        function getTenantUrl(tenantId) {
            const url = new URL("index.html", window.location.href);
            url.searchParams.set("leadserve", "1");
            url.searchParams.set("tenant", tenantId);
            return url.pathname + url.search;
        }

        // Which clinics is this user a member of? Read the provisioned reverse index
        // users/{uid}.clinicIds (Firestore), with a clinicMemberships fallback. Not
        // filtered by the static registry — provisioned clinics live only in Firestore.
        async function getMembershipClinicIds(user) {
            const ids = new Set();
            // uid-based reverse index (older provisioning)
            try {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists) ((userDoc.data() || {}).clinicIds || []).forEach((i) => ids.add(i));
            } catch (e) {}
            // email-based membership (admin-console provisioning)
            try {
                const email = (user.email || "").toLowerCase();
                if (email) {
                    const snap = await db.collection("clinics").where("memberEmails", "array-contains", email).get();
                    snap.docs.forEach((d) => ids.add(d.id));
                }
            } catch (e) {}
            return Array.from(ids);
        }

        // Load each clinic's profile from clinics/{id} and render a typed card.
        const TYPE_STYLE = {
            eye:      { a: "#1e73b8", bg: "#e6f1fb" },
            dental:   { a: "#0f9d8f", bg: "#dcf5f0" },
            dialysis: { a: "#c0392b", bg: "#fbe9e7" },
            lab:      { a: "#7c3aed", bg: "#efe8fd" },
            general:  { a: "#475569", bg: "#eef2f7" },
        };
        async function renderClinics(ids) {
            const TYPES = window.LEADSERVE_CLINIC_TYPES || {};
            clinicGrid.innerHTML = "";
            for (const tenantId of ids) {
                let clinic = Object.assign({}, tenants[tenantId] || {});
                try {
                    const snap = await db.collection("clinics").doc(tenantId).get();
                    if (snap.exists) clinic = Object.assign(clinic, snap.data());
                } catch (e) {}
                const type = clinic.clinicType || "general";
                const t = TYPES[type] || TYPES.general || { label: "Clinic", vertical: "", icon: "🏥" };
                const st = TYPE_STYLE[type] || TYPE_STYLE.general;
                const name = clinic.clinicName || tenantId;
                const card = document.createElement("button");
                card.className = "ls-card";
                card.type = "button";
                card.style.setProperty("--accent", st.a);
                card.style.setProperty("--accent-bg", st.bg);
                card.innerHTML = `
                    <span class="ls-badge">${t.label}</span>
                    <div class="ls-card-top">
                        <div class="ls-ico">${t.icon || "🏥"}</div>
                        <div>
                            <div class="ls-cname">${name}</div>
                            <div class="ls-cvert">${clinic.address || t.vertical || ""}</div>
                        </div>
                    </div>
                    <div class="ls-card-foot">
                        <span class="ls-wid">${tenantId}</span>
                        <span class="ls-open">Open workspace →</span>
                    </div>
                `;
                card.addEventListener("click", () => {
                    try { localStorage.setItem("leadserve.activeTenantId", tenantId); } catch (e) {}
                    window.location.href = getTenantUrl(tenantId);
                });
                clinicGrid.appendChild(card);
            }
        }

        async function loadClinics(user) {
            showClinics(user);
            setStatus(clinicStatus, "Loading clinic access...", false);
            const ids = await getMembershipClinicIds(user);
            await renderClinics(ids);
            setStatus(clinicStatus, ids.length ? "" : "No clinic workspace is assigned to this account yet.", !ids.length);
        }

        el("btnLogin").addEventListener("click", async () => {
            const email = (el("email").value || "").trim();
            const password = el("password").value || "";
            if (!email || !password) return setStatus(loginStatus, "Enter email and password.", true);

            setStatus(loginStatus, "Signing in...", false);
            try {
                await auth.signInWithEmailAndPassword(email, password);
                setStatus(loginStatus, "", false);
            } catch (e) {
                setStatus(loginStatus, e.message || "Sign in failed.", true);
            }
        });

        ["email", "password"].forEach((id) => {
            el(id).addEventListener("keydown", (event) => {
                if (event.key === "Enter") el("btnLogin").click();
            });
        });

        btnSignOut.addEventListener("click", () => auth.signOut());

        auth.onAuthStateChanged((user) => {
            if (!user) return showLogin();
            loadClinics(user);
        });
    </script>
</body>
</html>
